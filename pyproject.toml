[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-idp-engine"
version = "0.2.0"
description = "Reusable, configurable, provenance-preserving document extraction engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "pypdf>=5.0,<7.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "hypothesis==6.124.7",
  "ruff>=0.8,<1.0"
]
ocr = [
  "rapidocr-onnxruntime>=1.4.4,<2.0"
]
aws = [
  "boto3>=1.35,<2.0",
  "psycopg[binary]>=3.2,<4.0"
]

[project.scripts]
idp = "idp.cli:app"
idp-worker = "idp.worker:app"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["idp"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
